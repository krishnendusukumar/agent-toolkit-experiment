<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
    .header { background: #1a1a2e; color: white; padding: 16px 24px; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 12px; }
    .status { width: 10px; height: 10px; border-radius: 50%; background: #e74c3c; }
    .status.connected { background: #2ecc71; }
    .config { background: white; padding: 12px 24px; border-bottom: 1px solid #ddd; display: flex; gap: 12px; align-items: center; }
    .config label { font-size: 13px; color: #666; }
    .config input { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    #wsUrl { width: 400px; }
    #sessionId { width: 200px; }
    .config button { padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; }
    #connectBtn { background: #1a1a2e; color: white; }
    #connectBtn:hover { background: #16213e; }
    .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; }
    .message.user { align-self: flex-end; background: #1a1a2e; color: white; border-bottom-right-radius: 4px; }
    .message.assistant { align-self: flex-start; background: white; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }
    .message.system { align-self: center; background: #fff3cd; color: #856404; font-size: 12px; border-radius: 8px; }
    .input-area { padding: 16px 24px; background: white; border-top: 1px solid #ddd; display: flex; gap: 12px; }
    #messageInput { flex: 1; padding: 12px 16px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none; }
    #messageInput:focus { border-color: #1a1a2e; }
    #sendBtn { padding: 12px 24px; background: #1a1a2e; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
    #sendBtn:hover { background: #16213e; }
    #sendBtn:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="header">
    <div id="statusDot" class="status"></div>
    AI Chat — Bedrock + WebSocket
  </div>
  <div class="config">
    <label>WebSocket URL:</label>
    <input type="text" id="wsUrl" placeholder="wss://xxx.execute-api.us-east-1.amazonaws.com/prod">
    <label>Session:</label>
    <input type="text" id="sessionId" value="">
    <button id="connectBtn" onclick="toggleConnection()">Connect</button>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <input type="text" id="messageInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()" disabled>
    <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
  </div>

  <script>
    let ws = null;
    let currentAssistantDiv = null;
    let currentAssistantText = '';

    document.getElementById('sessionId').value = 'session-' + Math.random().toString(36).substring(2, 8);

    function addMessage(content, type) {
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.textContent = content;
      document.getElementById('messages').appendChild(div);
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
      return div;
    }

    function toggleConnection() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.close();
        return;
      }
      const url = document.getElementById('wsUrl').value.trim();
      if (!url) { alert('Enter a WebSocket URL'); return; }

      addMessage('Connecting...', 'system');
      ws = new WebSocket(url);

      ws.onopen = () => {
        document.getElementById('statusDot').classList.add('connected');
        document.getElementById('connectBtn').textContent = 'Disconnect';
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        addMessage('Connected', 'system');
      };

      ws.onclose = () => {
        document.getElementById('statusDot').classList.remove('connected');
        document.getElementById('connectBtn').textContent = 'Connect';
        document.getElementById('messageInput').disabled = true;
        document.getElementById('sendBtn').disabled = true;
        addMessage('Disconnected', 'system');
      };

      ws.onerror = () => addMessage('Connection error', 'system');

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'chunk') {
          if (!currentAssistantDiv) {
            currentAssistantDiv = addMessage('', 'assistant');
            currentAssistantText = '';
          }
          currentAssistantText += data.content;
          currentAssistantDiv.textContent = currentAssistantText;
          document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        } else if (data.type === 'end') {
          currentAssistantDiv = null;
          currentAssistantText = '';
          document.getElementById('sendBtn').disabled = false;
          document.getElementById('messageInput').disabled = false;
        } else if (data.type === 'error') {
          addMessage('Error: ' + data.message, 'system');
          document.getElementById('sendBtn').disabled = false;
          document.getElementById('messageInput').disabled = false;
        } else if (data.type === 'usage') {
          addMessage(`Tokens: ${data.usage.inputTokens} in, ${data.usage.outputTokens} out`, 'system');
        }
      };
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();
      if (!message || !ws || ws.readyState !== WebSocket.OPEN) return;

      addMessage(message, 'user');
      input.value = '';
      document.getElementById('sendBtn').disabled = true;
      document.getElementById('messageInput').disabled = true;

      ws.send(JSON.stringify({
        action: 'sendMessage',
        message: message,
        sessionId: document.getElementById('sessionId').value,
      }));
    }
  </script>
</body>
</html>
